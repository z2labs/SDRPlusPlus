name: Z2 SDR (Android APK)

# z2labs fork: SDR++ with the ESP-SDR (ESP32-S3) source module and the external FFT input
# (on-chip 16/40/80 MHz spectrum). Same build container as upstream's Android job.
on:
    push:
        branches: [esp-sdr]
        tags: ['esp-v*']
    workflow_dispatch:

jobs:
    build_android:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
        - uses: actions/checkout@v4
          with:
              submodules: recursive

        - name: Fetch container
          working-directory: ${{runner.workspace}}
          run: git clone https://github.com/AlexandreRouma/android-sdr-kit

        - name: Build container
          working-directory: ${{runner.workspace}}/android-sdr-kit
          run: docker build --progress=plain -t android-sdr-kit .

        - name: Record the git revision (git inside the container refuses the checkout)
          run: git rev-parse --short=7 HEAD > .git_rev

        - name: Build
          run: docker run --name build -v $GITHUB_WORKSPACE:/root/SDRPlusPlus android-sdr-kit /bin/bash -l -c "cd /root/SDRPlusPlus/android && gradle --info assembleDebug"

        - name: Recover APK
          working-directory: ${{runner.workspace}}
          run: docker cp build:/root/SDRPlusPlus/android/app/build/outputs/apk/debug/app-debug.apk ./ && mv app-debug.apk z2sdr.apk

        - name: Recover native libraries with symbols (crash reports in Download/sdrpp-log.txt)
          working-directory: ${{runner.workspace}}
          run: |
            mkdir -p symbols
            docker cp build:/root/SDRPlusPlus/android/app/build/intermediates/merged_native_libs/debug/out/lib/arm64-v8a symbols/ || true
            docker cp build:/root/SDRPlusPlus/android/app/build/intermediates/cxx symbols/cxx || true
            find symbols -name '*.so' -path '*arm64*' | head -50

        - name: Save symbols
          uses: actions/upload-artifact@v4
          with:
              name: z2sdr-android-symbols
              path: ${{runner.workspace}}/symbols/**/arm64-v8a/*.so

        - name: Save APK
          uses: actions/upload-artifact@v4
          with:
              name: z2sdr-android
              path: ${{runner.workspace}}/z2sdr.apk

        - name: Release (tags esp-v*)
          if: startsWith(github.ref, 'refs/tags/esp-v')
          uses: softprops/action-gh-release@v2
          with:
              body_path: .github/esp_release_notes.md
              files: ${{runner.workspace}}/z2sdr.apk
